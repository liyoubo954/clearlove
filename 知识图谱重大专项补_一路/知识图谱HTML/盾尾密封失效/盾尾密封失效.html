<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>知识图谱</title>
    <meta name="description" content="" />
    <meta name="keywords" content="" />
    <meta name="author" content="" />
    <link rel="shortcut icon" href="">
    <script src="https://cdn.bootcss.com/jquery/2.1.4/jquery.min.js"></script>
    <link href="https://cdn.bootcss.com/bootstrap/3.3.4/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.bootcss.com/bootstrap/3.3.4/js/bootstrap.min.js"></script>
    <link rel="stylesheet" type="text/css" href="css/graph.css" />
</head>
<body>

<!-- 第一个布局 绘制知识图谱主图 -->
<div style="text-align: center; position:relative;">
    <svg width="1000" height="900" style="margin-right:80px;margin-bottom:-20px;" id="svg1">
    </svg>
    <!-- 绘制右边显示结果 -->
    <div id="info">
        <h4></h4>
    </div>
</div>
<!-- 增加D3元素库 -->
<script src="js/d3.v4.min.js"></script>
<!-- 绘制图例 -->
<script type="text/javascript">
    $(document).ready(function() {
        // 定义svg变量将布局svg1选出来
        var svg = d3.select("#svg1"),
            width = svg.attr("width"),
            height = svg.attr("height");
        var g = svg.append("g").attr("class","graph");
        var defs = svg.append("defs");
        defs.append("marker").attr("id","arrow").attr("viewBox","0 -5 10 10").attr("refX",10).attr("refY",0).attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto")
            .append("path").attr("d","M0,-5L10,0L0,5").attr("fill","#bbb");
        var relColors = { '分类':'#66c2a5','导致':'#fc8d62','成因':'#8da0cb','包括':'#e78ac3','方法':'#a6d854','造成':'#ffd92f' };
        // 自定义图标及颜色（数组保证一一对应）
        // names 图例名称变量制作图标
        // labels 节点的标签名称（与records.json中保证相同）
        // colors 图例颜色
        // url json文件的路径
        var names = ['风险名称', '原因', '措施', '现象']
        var labels = ['风险名称', '原因', '措施', '现象']
        var colors = ['#F16667', '#F79767', '#7ff55a', '#55ffff']
        var url = 'data/盾尾密封失效.json'

        // 背景颜色设置 补充CSS样式设置字体布局
        for (var i = 0; i < names.length; i++) {
            $('#indicator').append("<div><span style='background-color:" + colors[i] + "'></span>" + names[i] +
                "</div>")
        }

        // 利用d3.forceSimulation()定义关系图 包括设置边link、排斥电荷charge、关系图中心点
        var simulation = d3.forceSimulation()
            .force("link", d3.forceLink().id(d => d.id).distance(110))
            .force("charge", d3.forceManyBody().strength(-180))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(d => d.label === labels[0] ? 28 : 22))
            .force("radial", d3.forceRadial(d => d.label === labels[0] ? 0 : 260, width / 2, height / 2).strength(0.02))
            .alpha(1)
            .alphaDecay(0.02);
        // 图数据
        var graph
        let nodes = []
        let links = [] // 存放节点和关系
        let nodeSet = [] // 存放去重后nodes的id
        //d3.json获取数据
        d3.json(url, function (error, data) {
            if (error) throw error
            graph = data
            console.log(graph[0].n)
            for (let item of graph) {
                for (let segment of item.p.segments) {
                    // 重新更改data格式
                    if (nodeSet.indexOf(segment.start.identity) == -1) {
                        nodeSet.push(segment.start.identity)
                        nodes.push({
                            id: segment.start.identity,
                            label: segment.start.labels[0],
                            properties: segment.start.properties
                        });
                    }
                    if (nodeSet.indexOf(segment.end.identity) == -1) {
                        nodeSet.push(segment.end.identity)
                        nodes.push({
                            id: segment.end.identity,
                            label: segment.end.labels[0],
                            properties: segment.end.properties
                        });
                    }
                    links.push({
                        source: segment.relationship.start,
                        target: segment.relationship.end,
                        type: segment.relationship.type,
                        properties: segment.relationship.properties
                    });
                }
            }
            console.log(nodes)
            console.log(links)
            // D3映射数据至HTML中
            // g用于绘制所有边,selectALL选中所有的line,并绑定数据data(graph.links),enter().append("line")添加元素
            // 数据驱动文档,设置边的粗细
            var linkGroup = g.append("g").attr("class", "links").selectAll("g").data(links).enter().append("g");

            var link = linkGroup.append("path")
                .attr("class", "link")
                .attr("stroke", d => relColors[d.type] || "#bbb")
                .attr("stroke-width", 2)
                .attr("fill", "none")
                .attr("marker-end", "url(#arrow)")
                .attr("id", function(d, i) { return "linkPath-" + i; });

            var labelPath = linkGroup.append("path")
                .attr("class", "label-path")
                .attr("fill", "none")
                .attr("stroke", "none")
                .attr("id", function(d, i) { return "labelPath-" + i; });

            var linkLabel = linkGroup.append("text")
                .attr("class", "link-label")
                .attr("fill", "#fff")
                .attr("font-size", "12px")
                .attr("text-anchor", "middle")
                .attr("dominant-baseline", "middle") // 垂直居中
                .append("textPath")
                .attr("xlink:href", function(d, i) { return "#labelPath-" + i; })
                .attr("startOffset", "50%")
                .text(function(d) { return d.type; });


            // 添加所有的点
            var node = g.append("g")
                .attr("class", "nodes")
                .selectAll("g")
                .data(nodes)
                .enter()
                .append("g")
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended));

            node.append("circle")
                .attr("r", function (d) {
                    let size = 25;
                    switch (d.label) {
                        case labels[0]:
                            break;
                        case labels[1]:
                            size = 20;
                            break;
                        case labels[2]:
                            size = 20;
                            break;
                        default:
                            size = 20;
                            break;
                    }
                    return size;
                })
                .attr("fill", function (d) {
                    for (let i = 0; i < labels.length; i++) {
                        if (d.label === labels[i]) return colors[i];
                    }
                })
                .attr("stroke", "none")
                .attr("name", function(d) {
                    return d.properties.name;
                })
                .attr("id", function (d) {
                    return d.id;
                })
                .on("click", function(d) {
                    var clickedNode = d3.select(this);
                    var id = clickedNode.attr("id");

                    console.log("Clicked Node ID:", id);
                });

            node.append("text")
                .attr("text-anchor", "middle")
                .attr("dy", "0.35em")
                .style("font-size", function (d) {
                    let size = 15;
                    switch (d.label) {
                        case labels[0]:
                            size = 15;
                            break;
                        case labels[1]:
                            size = 10;
                            break;
                        case labels[2]:
                            size = 10;
                            break;
                        default:
                            size = 10;
                            break;
                    }
                    return size + "px";
                })
                .text(function (d) {
                    let name = d.properties.name;
                    let maxLength = 3;
                    if (name.length > maxLength) {
                        return name.substring(0, maxLength) + '...';
                    }
                    return name;
                });

            var dummy = 0;

            var text = svg.append("g").attr("class", "texts").selectAll("text").data(nodes).enter()
                .append("text").attr("font-size", function (d) {
                    let size = 30;
                    switch (d.label) {
                        case labels[0]:
                            size = 25;
                            break;
                        case labels[1]:
                            size = 10;
                            break;
                        case labels[2]:
                            size = 10;
                            break;
                        default:
                            size = 10;
                            break;
                    }
                    return size + "px";
                })
                .attr("fill", function (d) {
                    for (let i = 0; i < labels.length; i++) {
                        if (d.label === labels[i]) return colors[i];
                    }
                })
                .attr('name', function (d) {
                    return d.properties.name;
                })
                .attr("text-anchor", "middle")
                .text(function (d) {
                    return d.properties.name;
                });

            node.append("title").text(d => d.properties.name)

            simulation.nodes(nodes).on("tick", ticked);

            simulation.force("link")
                .links(links)
                .distance(d => {
                    let distance = 60
                    switch (d.source.label) {
                        case labels[0]:
                            distance += 40;
                            break;
                        case labels[1]:
                            distance += 40;
                            break;
                        case labels[2]:
                            distance += 40;
                            break;
                        default:
                            distance += 40;
                            break;
                    }
                    switch (d.target.label) {
                        case labels[0]:
                            distance += 30;
                            break;
                        case labels[1]:
                            distance += 30;
                            break;
                        case labels[2]:
                            distance += 30;
                            break;
                        default:
                            distance += 30;
                            break;
                    }
                    return distance
                });

            function ticked() {
                updateLinkPositions();
                updateNodePositions();
            }

            function updateLinkPositions() {
                link.attr("d", function(d) {
                    var dx = d.target.x - d.source.x;
                    var dy = d.target.y - d.source.y;
                    var dr = Math.sqrt(dx * dx + dy * dy);
                    if (dr === 0) return "M" + d.source.x + "," + d.source.y + " L" + d.target.x + "," + d.target.y;
                    
                    // 获取目标节点的半径，labels[0] 是 '风险名称'
                    var r = (d.target.label === labels[0] ? 25 : 20) + 7; // 增加偏移量以容纳箭头
                    
                    var targetX = d.target.x - (dx * r) / dr;
                    var targetY = d.target.y - (dy * r) / dr;
                    
                    return "M" + d.source.x + "," + d.source.y + " L" + targetX + "," + targetY;
                });
                labelPath.attr("d", function(d) {
                    var dx = d.target.x - d.source.x;
                    var dy = d.target.y - d.source.y;
                    var dr = Math.sqrt(dx * dx + dy * dy);
                    if (dr === 0) return "M" + d.source.x + "," + d.source.y + " L" + d.target.x + "," + d.target.y;

                    var r = (d.target.label === labels[0] ? 25 : 20) + 7;
                    var targetX = d.target.x - (dx * r) / dr;
                    var targetY = d.target.y - (dy * r) / dr;

                    var angle = Math.atan2(d.target.y - d.source.y, d.target.x - d.source.x) * 180 / Math.PI;
                    if (angle > 90 || angle < -90) {
                        return "M" + targetX + "," + targetY + " L" + d.source.x + "," + d.source.y;
                    } else {
                        return "M" + d.source.x + "," + d.source.y + " L" + targetX + "," + targetY;
                    }
                });
            }






            function updateNodePositions() {
                node.attr("transform", function (d) {
                    return "translate(" + d.x + "," + d.y + ")";
                });
            }
        });
        // 拖动函数代码
        var dragging = false;

        // 开始拖动并更新相应的点
        function dragstarted(d) {
            if (!d3.event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
            dragging = true;
        }

        function dragged(d) {
            d.fx = d3.event.x;
            d.fy = d3.event.y;
            updateLinkPositions();  // 更新边的位置
            updateNodePositions();  // 更新节点的位置
        }

        function dragended(d) {
            if (!d3.event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
            dragging = false;
        }

        svg.call(d3.zoom().scaleExtent([0.3, 3]).on('zoom', function(){
            g.attr('transform', d3.event.transform);
        }));

        setTimeout(() => { simulation.alphaTarget(0); }, 10000);

        // 设置鼠标选中节点显示，并循环设置与选中节点相关联的节点显示
        // 为svg1父元素下的.nodes circle元素绑定鼠标进入事件
        // 设置鼠标选中节点显示，并循环设置与选中节点相关联的节点显示
        $('#svg1').on('mouseenter', '.nodes circle', function (event) {
            if (!dragging) {
                var name = $(this).attr("name");
                var id = $(this).attr("id");
                $('#info p').remove();
                for (let item of nodes) {
                    if (item.id == id) {
                        for (var key in item.properties) {
                            $('#info').append('<p><span>' + key + '</span>' + item.properties[key] + '</p>').css('text-align', 'left');
                        }
                    }
                }

                // 让相关节点和边保持亮起状态，其他节点和边变暗
                d3.select('#svg1 .nodes').selectAll('circle').attr('class', function (d) {
                    if (d.id == id) {
                        return '';
                    }
                    for (var i = 0; i < links.length; i++) {
                        if ((links[i]['source'].id == id && links[i]['target'].id == d.id) ||
                            (links[i]['target'].id == id && links[i]['source'].id == d.id)) {
                            return '';
                        }
                    }
                    return 'inactive';
                });

                d3.select('#svg1 .nodes').selectAll('text').attr('class', function (d) {
                    if (d.id == id) {
                        return '';
                    }
                    for (var i = 0; i < links.length; i++) {
                        if ((links[i]['source'].id == id && links[i]['target'].id == d.id) ||
                            (links[i]['target'].id == id && links[i]['source'].id == d.id)) {
                            return '';
                        }
                    }
                    return 'inactive';
                });

                d3.select('#svg1 .links').selectAll('path').attr('class', function (d) {
                    if (d.source.id == id || d.target.id == id) {
                        return '';
                    } else {
                        return 'inactive';
                    }
                });

                d3.select('#svg1 .links').selectAll('text').attr('class', function (d) {
                    if (d.source.id == id || d.target.id == id) {
                        return 'link-label';
                    } else {
                        return 'link-label inactive';
                    }
                });

                d3.select('#svg1 .texts').selectAll('text').attr('class', function (d) {
                    if (d.id == id) {
                        return '';
                    }
                    for (var i = 0; i < links.length; i++) {
                        if ((links[i]['source'].id == id && links[i]['target'].id == d.id) ||
                            (links[i]['target'].id == id && links[i]['source'].id == d.id)) {
                            return '';
                        }
                    }
                    return 'inactive';
                });
            }
        });

// 恢复所有节点和边的亮状态
        $('#svg1').on('mouseleave', '.nodes circle', function (event) {
            if (!dragging) {
                // 恢复所有节点和线的初始亮状态
                d3.select('#svg1 .texts').selectAll('text').attr('class', '');
                d3.select('#svg1 .links').selectAll('path').attr('class', 'link');
                d3.select('#svg1 .links').selectAll('text').attr('class', 'link-label');
                d3.select('#svg1 .nodes').selectAll('circle').attr('class', '');
            }
        });

    });
</script>
</body>
</html>
