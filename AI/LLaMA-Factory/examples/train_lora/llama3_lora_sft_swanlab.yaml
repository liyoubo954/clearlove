### model
model_name_or_path: meta-llama/Meta-Llama-3-8B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
dataset: identity,alpaca_en_demo
template: llama3
cutoff_len: 2048
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/llama3-8b/lora/sft
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: swanlab  # 启用 SwanLab 实验监控

### SwanLab 配置
use_swanlab: true
swanlab_project: llama3-lora-sft  # 项目名称
swanlab_run_name: llama3-8b-lora-sft-experiment  # 实验运行名称
swanlab_mode: cloud  # 模式：cloud（云端）或 local（本地）
# swanlab_api_key: your_api_key_here  # API 密钥（可选，也可通过环境变量设置）
# swanlab_workspace: your_workspace  # 工作空间（可选）
# swanlab_logdir: ./logs  # 本地日志目录（本地模式时使用）

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

